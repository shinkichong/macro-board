name: 매크로 데이터 갱신

on:
  schedule:
    # cron 은 UTC 기준입니다. KST = UTC+9.
    # 정시(0분)는 GitHub 전체에서 스케줄이 몰려 지연되기 쉽다고 공식 문서에
    # 명시돼 있어(https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule),
    # 분 단위를 정시에서 벗어나게 잡는다. 시각은 근사치로만 이해하면 된다.
    #
    # 미국 데이터: KST 약 06:17 + 07:23 (1시간 뒤 재시도 — FRED 가 그 순간 응답 없으면
    # 다음 시각에 다시 시도), 화~토요일에만 (월요일은 건너뜀 — 전날이 일요일이라
    # 새 데이터가 없음). UTC 로는 전날 21:17 / 22:23 이라, 트리거는 월~금
    # 21:17 / 22:23 UTC → 화~토 06:17 / 07:23 KST 에 찍힌다.
    - cron: "17 21 * * 1-5"
    - cron: "23 22 * * 1-5"
    # 국내 데이터: 평일 KST 약 16:13 + 17:41 (마찬가지로 1시간 뒤 재시도) = UTC 07:13 / 08:41
    - cron: "13 7 * * 1-5"
    - cron: "41 8 * * 1-5"
  workflow_dispatch:           # Actions 탭 수동 실행, 또는 대시보드의 "업데이트" 버튼(API 호출)
    inputs:
      group:
        description: "갱신할 그룹 (비워두면 전체)"
        required: false
        type: choice
        default: "전체"
        options:
          - "전체"
          - "미국 시장"
          - "국내 시장"
  push:
    paths:
      - "scripts/**"
      - "src/**"
      - ".github/workflows/update-data.yml"

concurrency:
  group: macro-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 한 소스가 죽어도 나머지는 갱신된다. 실패분은 직전 값을 물려받고
      # 화면에 "갱신 실패" 배지가 붙으므로, 여기서 잡을 이유가 없다.
      #
      # 스케줄 트리거는 미국/국내를 분리해서 갱신한다 (--group).
      # 수동 실행(workflow_dispatch)은 group 입력값을 따른다 — 대시보드의
      # "업데이트" 버튼이 이 입력값을 채워 API 로 호출한다. push 트리거는 전체.
      - name: 데이터 수집
        run: |
          GROUP="${{ github.event.inputs.group }}"
          case "${{ github.event.schedule }}" in
            "17 21 * * 1-5"|"23 22 * * 1-5") python scripts/fetch_data.py --group "미국 시장" ;;
            "13 7 * * 1-5"|"41 8 * * 1-5")   python scripts/fetch_data.py --group "국내 시장" ;;
            *)
              if [ -n "$GROUP" ] && [ "$GROUP" != "전체" ]; then
                python scripts/fetch_data.py --group "$GROUP"
              else
                python scripts/fetch_data.py
              fi
              ;;
          esac
        env:
          # VKOSPI 공식 오픈API 용. 없어도 돌아가며, 그때는 정보데이터시스템으로 떨어집니다.
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        continue-on-error: true

      - name: 페이지 빌드
        run: python scripts/build_page.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro.json index.html
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

  publish:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - run: git pull --ff-only || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
