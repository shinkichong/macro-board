name: 매크로 데이터 갱신

on:
  schedule:
    # cron 은 UTC 기준입니다.
    - cron: "10 22 * * 1-5"   # 07:10 KST — 미국 장 마감 직후
    - cron: "20 07 * * 1-5"   # 16:20 KST — 국내 장 마감 직후
  workflow_dispatch:           # Actions 탭에서 수동 실행
  push:
    paths:
      - "scripts/**"
      - "src/**"
      - ".github/workflows/update-data.yml"

concurrency:
  group: macro-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 한 소스가 죽어도 나머지는 갱신된다. 실패분은 직전 값을 물려받고
      # 화면에 "갱신 실패" 배지가 붙으므로, 여기서 잡을 이유가 없다.
      - name: 데이터 수집
        run: python scripts/fetch_data.py
        env:
          # VKOSPI 공식 오픈API 용. 없어도 돌아가며, 그때는 정보데이터시스템으로 떨어집니다.
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        continue-on-error: true

      - name: 페이지 빌드
        run: python scripts/build_page.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro.json index.html
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

  publish:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - run: git pull --ff-only || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
