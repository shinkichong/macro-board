name: 매크로 데이터 갱신

on:
  schedule:
    # cron 은 UTC 기준입니다. KST = UTC+9.
    # 미국 데이터: KST 06:00 + 07:00 (1시간 뒤 재시도 — FRED 가 그 순간 응답 없으면
    # 다음 시각에 다시 시도), 화~토요일에만 (월요일은 건너뜀 — 전날이 일요일이라
    # 새 데이터가 없음). UTC 로는 전날 21:00 / 22:00 이라, 트리거는 월~금
    # 21:00 / 22:00 UTC → 화~토 06:00 / 07:00 KST 에 찍힌다.
    - cron: "0 21 * * 1-5"
    - cron: "0 22 * * 1-5"
    # 국내 데이터: 평일 KST 16:00 + 17:00 (마찬가지로 1시간 뒤 재시도) = UTC 07:00 / 08:00
    - cron: "0 7 * * 1-5"
    - cron: "0 8 * * 1-5"
  workflow_dispatch:           # Actions 탭에서 수동 실행
  push:
    paths:
      - "scripts/**"
      - "src/**"
      - ".github/workflows/update-data.yml"

concurrency:
  group: macro-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 한 소스가 죽어도 나머지는 갱신된다. 실패분은 직전 값을 물려받고
      # 화면에 "갱신 실패" 배지가 붙으므로, 여기서 잡을 이유가 없다.
      #
      # 스케줄 트리거일 때만 미국/국내를 분리해서 갱신한다 (--group).
      # 수동 실행(workflow_dispatch)이나 push 트리거는 전체를 갱신한다.
      - name: 데이터 수집
        run: |
          case "${{ github.event.schedule }}" in
            "0 21 * * 1-5"|"0 22 * * 1-5") python scripts/fetch_data.py --group "미국 시장" ;;
            "0 7 * * 1-5"|"0 8 * * 1-5")   python scripts/fetch_data.py --group "국내 시장" ;;
            *)                             python scripts/fetch_data.py ;;
          esac
        env:
          # VKOSPI 공식 오픈API 용. 없어도 돌아가며, 그때는 정보데이터시스템으로 떨어집니다.
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        continue-on-error: true

      - name: 페이지 빌드
        run: python scripts/build_page.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro.json index.html
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 갱신 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

  publish:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - run: git pull --ff-only || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
