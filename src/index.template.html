<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매크로 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edf1; --surface:#fff; --surface-2:#f2f6f9; --rule:#d3dbe2;
  --ink:#16232c; --ink-2:#566977; --ink-3:#8797a3;
  --good:#1c7a58; --bad:#b0433e; --line:#34496b;
  --good-soft:rgba(28,122,88,.15); --bad-soft:rgba(176,67,62,.15);
  --line-soft:rgba(52,73,107,.11);
  --focus:#2f6fd0; --shadow:0 1px 2px rgba(22,35,44,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c161c; --surface:#13212a; --surface-2:#182a34; --rule:#243a47;
    --ink:#dce8ef; --ink-2:#8ea6b3; --ink-3:#627d8b;
    --good:#4dbe91; --bad:#e2726c; --line:#93b6dc;
    --good-soft:rgba(77,190,145,.16); --bad-soft:rgba(226,114,108,.16);
    --line-soft:rgba(147,182,220,.13);
    --focus:#7fb0f0; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0c161c; --surface:#13212a; --surface-2:#182a34; --rule:#243a47;
  --ink:#dce8ef; --ink-2:#8ea6b3; --ink-3:#627d8b;
  --good:#4dbe91; --bad:#e2726c; --line:#93b6dc;
  --good-soft:rgba(77,190,145,.16); --bad-soft:rgba(226,114,108,.16);
  --line-soft:rgba(147,182,220,.13);
  --focus:#7fb0f0; --shadow:0 1px 2px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans","IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-variant-numeric:tabular-nums; line-height:1.5;
}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px}
.wrap{max-width:1360px; margin:0 auto; padding:26px 20px 64px}

.head{display:flex; flex-wrap:wrap; gap:12px 22px; align-items:baseline; margin-bottom:18px}
.head h1{font-size:22px; font-weight:600; letter-spacing:-.015em; margin:0}
.stamp{color:var(--ink-2); font-size:13px}
.stamp b{color:var(--ink); font-weight:500}
.tools{margin-left:auto; display:flex; gap:8px; align-items:center}
.seg{display:flex; background:var(--surface); border:1px solid var(--rule); border-radius:7px; overflow:hidden}
.seg button{
  font:inherit; font-size:12.5px; padding:5px 11px; border:0; background:none;
  color:var(--ink-2); cursor:pointer; border-right:1px solid var(--rule);
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface); font-weight:500}

.market-tabs{display:flex; gap:8px; margin-bottom:18px}
.market-tabs button{
  font:inherit; font-size:13.5px; font-weight:500; padding:8px 18px; cursor:pointer;
  color:var(--ink-2); background:var(--surface); border:1px solid var(--rule); border-radius:8px;
}
.market-tabs button:hover{border-color:var(--ink-3)}
.market-tabs button[aria-selected="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
@media (max-width:560px){ .market-tabs{flex-wrap:wrap} }
.icon-btn{
  font:inherit; font-size:12.5px; padding:5px 11px; cursor:pointer; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--rule); border-radius:7px;
}

.demo-note{
  display:flex; gap:9px; align-items:flex-start; margin-bottom:18px; padding:10px 13px;
  border:1px solid var(--rule); border-left:3px solid var(--bad);
  border-radius:6px; background:var(--surface); font-size:13px; color:var(--ink-2);
}
.demo-note b{color:var(--ink); font-weight:600}
.demo-note code{
  background:var(--surface-2); border:1px solid var(--rule);
  padding:1px 5px; border-radius:3px; font-size:12px;
}

.group{margin-bottom:34px}
.group > h2{
  font-size:14px; font-weight:600; margin:0 0 12px; color:var(--ink-2);
  display:flex; align-items:center; gap:10px;
}
.group > h2 .rule{flex:1; height:1px; background:var(--rule)}
.update-btn{
  font-size:11px; font-weight:500; padding:4px 10px; border-radius:6px;
  border:1px solid var(--rule); background:var(--surface); color:var(--ink-2); cursor:pointer;
}
.update-btn:hover{border-color:var(--ink-3)}
.update-btn:disabled{opacity:.55; cursor:default}
.grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}

.card{
  position:relative; background:var(--surface); border:1px solid var(--rule);
  border-radius:9px; padding:13px 15px 9px 17px; box-shadow:var(--shadow); overflow:hidden;
}
.card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--ink-3)}
.card[data-state="good"]::before{background:var(--good)}
.card[data-state="bad"]::before{background:var(--bad)}
.card h3{font-size:13.5px; font-weight:500; margin:0; color:var(--ink-2)}
.card h3 .ext{font-size:11px; font-weight:400; color:var(--ink-3)}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:var(--ink-3)}
.card.clickable:hover h3 .ext{color:var(--ink-2)}
.card.clickable:focus-visible{outline:2px solid var(--ink-3); outline-offset:2px}
.card-top{display:flex; align-items:flex-start; gap:10px}
.card-top .seg{margin-left:auto; flex:0 0 auto}
.card-top .seg button{padding:3px 8px; font-size:11.5px}

/* 숫자·증감·회색 태그를 항상 한 줄에. 자리가 모자라면 태그만 줄어들고 "…" 로 잘린다(전체 내용은 title). */
.readout{display:flex; align-items:baseline; gap:7px; flex-wrap:nowrap; margin:3px 0 2px; min-width:0}
.readout .now{font-size:26px; font-weight:600; letter-spacing:-.02em; line-height:1.15; flex:0 0 auto; white-space:nowrap}
.readout .delta{font-size:13px; font-weight:500; flex:0 0 auto; white-space:nowrap}
.readout .delta[data-dir="up"]{color:var(--good)}
.readout .delta[data-dir="down"]{color:var(--bad)}
.readout .tag{
  font-size:11px; padding:2px 6px; border-radius:4px; white-space:nowrap;
  min-width:0; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis;
  background:var(--surface-2); border:1px solid var(--rule); color:var(--ink-2);
}
.chart{position:relative; margin:4px 0 0}
.chart svg{display:block; width:100%; height:auto}
.card footer{
  display:flex; justify-content:space-between; gap:10px; margin-top:6px; padding-top:7px;
  border-top:1px solid var(--rule); font-size:11.5px; color:var(--ink-3);
}
.card footer a{color:inherit; text-decoration-color:var(--rule)}
.card footer a:hover{color:var(--ink-2)}
.stale{color:var(--bad); font-weight:500}
.note{margin:4px 0 0; font-size:11.5px; color:var(--ink-3)}

/* ── Buy-the-Dip 요약 줄 + 기준 팝업 ───────────────────────────── */
.dip-strip{
  display:flex; flex-wrap:wrap; align-items:stretch; gap:10px; margin:0 0 14px;
}
.dip-item{
  flex:1 1 300px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--rule); border-left:3px solid var(--ink-3);
  border-radius:8px; padding:9px 14px; box-shadow:var(--shadow);
}
.dip-item[data-state="good"]{border-left-color:var(--good)}
.dip-item .dip-name{font-size:12.5px; color:var(--ink-2); min-width:118px}
.dip-item .dip-name small{display:block; font-size:11px; color:var(--ink-3)}
.dip-item .dip-score{font-size:24px; font-weight:600; letter-spacing:-.02em; line-height:1}
.dip-item .dip-score span{font-size:13px; font-weight:500; color:var(--ink-2); margin-left:2px}
.dip-item .delta{font-size:12.5px; font-weight:500}
.dip-item .delta[data-dir="up"]{color:var(--good)}
.dip-item .delta[data-dir="down"]{color:var(--bad)}
.dip-item .dip-stage{
  font-size:12.5px; font-weight:600; padding:3px 9px; border-radius:5px;
  background:var(--surface-2); border:1px solid var(--rule);
}
.dip-item[data-state="good"] .dip-stage{background:var(--good-soft); border-color:transparent; color:var(--good)}
.dip-item .dip-pct{font-size:12.5px; color:var(--ink-2)}
.dip-item .dip-pct b{color:var(--ink); font-weight:600}
.dip-item .dip-plan{flex-basis:100%; margin-top:-4px; padding-top:6px; border-top:1px dashed var(--rule)}
.dip-info{
  align-self:center; font:inherit; font-size:12px; font-weight:500; padding:8px 12px; cursor:pointer;
  border:1px solid var(--rule); border-radius:8px; background:var(--surface); color:var(--ink-2);
}
.dip-info:hover{border-color:var(--ink-3); color:var(--ink)}

dialog.dip-dlg{
  width:min(860px, calc(100vw - 32px)); max-height:calc(100vh - 48px); padding:0;
  border:1px solid var(--rule); border-radius:10px; background:var(--surface); color:var(--ink);
  box-shadow:0 10px 40px rgba(0,0,0,.25);
}
dialog.dip-dlg::backdrop{background:rgba(10,18,24,.45)}
.dip-dlg .dlg-head{
  position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--rule);
}
.dip-dlg .dlg-head h2{font-size:15px; margin:0 auto 0 0}
.dip-dlg .dlg-close{
  font:inherit; font-size:18px; line-height:1; width:30px; height:30px; cursor:pointer;
  border:1px solid var(--rule); border-radius:6px; background:none; color:var(--ink-2);
}
.dip-dlg .dlg-body{padding:6px 16px 18px; font-size:13px}
.dip-dlg h3{font-size:13.5px; margin:16px 0 6px}
.dip-dlg p.hint{margin:4px 0 8px; font-size:12px; color:var(--ink-3)}
.dip-dlg table{width:100%; border-collapse:collapse; font-size:12.5px}
.dip-dlg th, .dip-dlg td{padding:5px 8px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:top}
.dip-dlg th{font-weight:500; color:var(--ink-2); background:var(--surface-2)}
.dip-dlg td.num, .dip-dlg th.num{text-align:right; white-space:nowrap}
.dip-dlg tr.total td{font-weight:600; border-top:2px solid var(--rule)}
.dip-dlg tr.cur td{background:var(--good-soft); font-weight:600}
.dip-dlg td small{display:block; color:var(--ink-3); font-size:11px}
.dip-dlg .bands{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.dip-dlg .bands table{font-size:12px}
.dip-dlg .bands caption{caption-side:top; text-align:left; font-size:12.5px; font-weight:500; padding:0 0 4px}
.dip-dlg .bands caption span{color:var(--ink-3); font-weight:400}
.dip-dlg .met{color:var(--good); font-weight:600}
.dip-item, .dip-strip > *{min-width:0}
.dip-dlg .dlg-body{overflow-x:auto}
@media (max-width:560px){
  dialog.dip-dlg{width:calc(100vw - 12px); max-height:calc(100vh - 16px)}
  .dip-dlg .dlg-head{padding:10px 10px}
  .dip-dlg .dlg-body{padding:4px 8px 14px}
  .dip-dlg table{font-size:11.5px}
  .dip-dlg th, .dip-dlg td{padding:4px 4px}
  .dip-dlg td small{font-size:10.5px}
}
@media (max-width:560px){
  .dip-item{flex-basis:100%; gap:8px 10px; padding:9px 12px}
  .dip-item .dip-name{min-width:0; flex-basis:100%}
  .dip-info{flex-basis:100%}
}

/* 매수 구간: 요약 줄을 초록으로 채우고 "매수 신호" 배지 + 은은한 깜빡임 */
.dip-item[data-state="good"]{
  background:var(--good); border-color:var(--good); color:#fff;
  box-shadow:0 0 0 3px var(--good-soft), var(--shadow);
  animation:dipPulse 2.4s ease-in-out infinite;
}
.dip-item[data-state="good"] .dip-name,
.dip-item[data-state="good"] .dip-name small,
.dip-item[data-state="good"] .dip-pct,
.dip-item[data-state="good"] .dip-pct b,
.dip-item[data-state="good"] .delta,
.dip-item[data-state="good"] .dip-score span,
.dip-item[data-state="good"] .dip-pct small{color:#fff}
.dip-item[data-state="good"] .dip-stage{background:#fff; color:var(--good); border-color:#fff}
.dip-item .dip-buy{display:none}
.dip-item[data-state="good"] .dip-buy{
  display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.02em;
  padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.6);
}
@keyframes dipPulse{
  0%,100%{box-shadow:0 0 0 3px var(--good-soft), var(--shadow)}
  50%{box-shadow:0 0 0 7px var(--good-soft), var(--shadow)}
}
@media (prefers-reduced-motion:reduce){ .dip-item[data-state="good"]{animation:none} }
/* 카드도 매수 구간이면 옅은 초록 배경 */
.card.dip-card[data-state="good"]{background:linear-gradient(var(--good-soft), var(--good-soft)), var(--surface); border-color:var(--good)}

.tip{
  position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-100%);
  background:var(--ink); color:var(--surface); font-size:11.5px; line-height:1.35;
  padding:5px 8px; border-radius:5px; white-space:nowrap; z-index:5;
}
.tip[data-on="1"]{opacity:1}
@media (prefers-reduced-motion:no-preference){ .tip{transition:opacity .09s} }

.empty{padding:46px; text-align:center; color:var(--ink-2)}
@media (max-width:560px){
  .wrap{padding:18px 13px 48px}
  .readout .now{font-size:23px}
  .grid{grid-template-columns:1fr}
  .tools{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>매크로 보드</h1>
    <div class="stamp" id="stamp"></div>
    <div class="tools">
      <div class="seg" id="ranges" role="group" aria-label="표시 기간"></div>
      <button class="icon-btn" id="theme" type="button">테마 전환</button>
    </div>
  </header>

  <div class="market-tabs" id="marketTabs" role="tablist" aria-label="시장 구분"></div>

  <div id="notice"></div>
  <main id="board"><div class="empty">데이터를 불러오는 중…</div></main>
</div>

<div class="tip" id="tip"></div>

<script id="embedded" type="application/json">__EMBEDDED_DATA__</script>
<script>
"use strict";

const RANGES = [["1년",1],["3년",3],["5년",5],["10년",10],["전체",null]];
const STATE = { years: 3, data: null, fx: "fixed", market: "all" };

const tip = document.getElementById("tip");
const fmt = (v, d) => Number(v).toLocaleString("ko-KR",
  {minimumFractionDigits:d, maximumFractionDigits:d});
const shortDate = s => s.slice(2).replace(/-/g, ".");

/* 저장소의 실데이터를 먼저 찾고, 없으면 내장 데모로 떨어진다. */
async function load(){
  try{
    const r = await fetch("./data/macro.json", {cache:"no-store"});
    if(r.ok) return await r.json();
  }catch(_){ /* 수집 전이거나 file:// 로 연 경우 */ }
  return JSON.parse(document.getElementById("embedded").textContent);
}

/* 이 카드가 지금 어느 계열을 그려야 하는지 — 글로벌 M2 만 환율 방식을 고를 수 있다. */
const activeData = s =>
  (s.fixed_fx && STATE.fx === "fixed") ? s.fixed_fx : s.data;

/* 기준선이 있으면 기준선 대비, 없으면(주가지수) 200일 이동평균 대비로 판정. */
function judge(s, full){
  const v = full[full.length - 1][1];
  if(s.threshold !== null && s.threshold !== undefined){
    const below = v < s.threshold;
    const state = (below === (s.below_is === "good")) ? "good" : "bad";
    let word = `${fmt(s.threshold, s.decimals)} ${below ? "아래" : "위"}`;
    if(s.bands){
      const b = s.bands.find(([lo, hi]) => v >= lo && v < hi) || s.bands[s.bands.length - 1];
      word = b[2];
    }
    return {state, word};
  }
  const closes = full.slice(-200).map(p => p[1]);
  if(closes.length < 20) return {state:"neutral", word:""};
  const ma = closes.reduce((a, b) => a + b, 0) / closes.length;
  return {state: v >= ma ? "good" : "bad", word: `200일선 ${v >= ma ? "위" : "아래"}`};
}

function slice(data, years){
  if(!years) return data;
  const last = new Date(data[data.length - 1][0] + "T00:00:00Z");
  last.setUTCFullYear(last.getUTCFullYear() - years);
  const from = last.toISOString().slice(0, 10);
  const out = data.filter(p => p[0] >= from);
  return out.length > 2 ? out : data;
}

/* 상단 기간 선택(1년/3년/…)과 무관하게 항상 최근 N개월만 보여줄 때 쓴다. */
function lastMonths(data, months){
  const last = new Date(data[data.length - 1][0] + "T00:00:00Z");
  last.setUTCMonth(last.getUTCMonth() - months);
  const from = last.toISOString().slice(0, 10);
  const out = data.filter(p => p[0] >= from);
  return out.length > 2 ? out : data;
}

/* ── 차트 ──────────────────────────────────────────────────────────
   viewBox 를 카드 폭과 비슷한 눈금으로 잡아, 글자 크기가 화면 픽셀과
   거의 1:1 로 맞도록 했다.                                            */
const VB = {w:340, h:118, t:9, r:40, b:19, l:4};

function chartSVG(pts, opt){
  const n = pts.length;
  const vals = pts.map(p => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const th = (opt.threshold === null || opt.threshold === undefined) ? null : opt.threshold;
  if(th !== null){ lo = Math.min(lo, th); hi = Math.max(hi, th); }
  if(hi === lo){ hi += 1; lo -= 1; }
  const gridLo = lo, gridHi = hi, span = hi - lo;
  lo -= span * 0.12; hi += span * 0.12;

  const x = i => VB.l + (i / Math.max(1, n - 1)) * (VB.w - VB.l - VB.r);
  const y = v => VB.t + (1 - (v - lo) / (hi - lo)) * (VB.h - VB.t - VB.b);

  const line = pts.map((p, i) =>
    `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const base = th !== null ? y(th) : VB.h - VB.b;
  const area = `${line}L${x(n-1).toFixed(1)},${base.toFixed(1)}L${x(0).toFixed(1)},${base.toFixed(1)}Z`;

  const axisDec = Math.abs(gridHi) >= 1000 ? 0
                : Math.abs(gridHi) >= 100  ? Math.min(opt.decimals, 1)
                : opt.decimals;
  const grid = [gridLo, (gridLo + gridHi) / 2, gridHi].map(v => {
    const yy = y(v).toFixed(1);
    return `<line x1="${VB.l}" x2="${VB.w - VB.r}" y1="${yy}" y2="${yy}"
                  stroke="var(--rule)" stroke-width=".7"/>
            <text x="${VB.w - VB.r + 5}" y="${(+yy + 3.3).toFixed(1)}" font-size="9.5"
                  fill="var(--ink-3)">${fmt(v, axisDec)}</text>`;
  }).join("");

  const uid = "c" + Math.random().toString(36).slice(2, 9);
  let fills = "";
  let defs = `<clipPath id="${uid}p"><rect x="0" y="${VB.t}" width="${VB.w}"
                                           height="${VB.h - VB.t - VB.b}"/></clipPath>`;
  if(th !== null){
    const up   = opt.belowIs === "good" ? "var(--bad-soft)"  : "var(--good-soft)";
    const down = opt.belowIs === "good" ? "var(--good-soft)" : "var(--bad-soft)";
    defs += `<clipPath id="${uid}u"><rect x="0" y="0" width="${VB.w}" height="${base.toFixed(1)}"/></clipPath>
            <clipPath id="${uid}d"><rect x="0" y="${base.toFixed(1)}" width="${VB.w}" height="${VB.h}"/></clipPath>`;
    fills = `<path d="${area}" fill="${up}" clip-path="url(#${uid}u)"/>
             <path d="${area}" fill="${down}" clip-path="url(#${uid}d)"/>
             <line x1="${VB.l}" x2="${VB.w - VB.r}" y1="${base.toFixed(1)}" y2="${base.toFixed(1)}"
                   stroke="var(--ink-3)" stroke-width=".9" stroke-dasharray="4 3"/>`;
  }else{
    // 기준선이 없는 지수 차트. 초록은 "양호"로 읽히므로 중립색으로 채우고,
    // 상태 배지가 근거로 삼는 200일 이동평균을 실제로 그려준다.
    fills = `<path d="${area}" fill="var(--line-soft)"/>`;
    if(opt.ma && opt.ma.length === n){
      const mp = opt.ma.map((v, i) => v === null ? null :
        `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);
      if(mp.length > 1){
        fills += `<polyline points="${mp.join(" ")}" fill="none" stroke="var(--ink-3)"
                            stroke-width="1" stroke-dasharray="3 2.5" opacity=".8"
                            clip-path="url(#${uid}p)"/>`;
      }
    }
  }

  return {
    markup:`<svg viewBox="0 0 ${VB.w} ${VB.h}" role="img" aria-label="${opt.label} 추이">
      <defs>${defs}</defs>${grid}${fills}
      <path d="${line}" fill="none" stroke="var(--line)" stroke-width="1.5"
            stroke-linejoin="round" stroke-linecap="round"/>
      <line class="cross" x1="0" x2="0" y1="${VB.t}" y2="${VB.h - VB.b}"
            stroke="var(--ink-3)" stroke-width=".9" opacity="0"/>
      <circle class="dot" r="3" fill="var(--line)" opacity="0"/>
      <text x="${VB.l}" y="${VB.h - 4}" font-size="9.5" fill="var(--ink-3)">${shortDate(pts[0][0])}</text>
      <text x="${VB.w - VB.r}" y="${VB.h - 4}" font-size="9.5" text-anchor="end"
            fill="var(--ink-3)">${shortDate(pts[n-1][0])}</text>
    </svg>`, x, y, n
  };
}

/* 듀얼축 차트 — 사용자가 제공한 원본 matplotlib 캡처(FearGreed_sp500.png 등)를
   그대로 재현: 제목, 좌우 범례, 가로+세로 격자, 월별 x축 눈금, 회전된 축 이름표까지. */
const VB2 = {w:400, h:280, t:16, r:42, b:30, l:32};
const OSC_COLOR = "#2f6fd0";
const PRICE_COLOR = "#1c9a5b";

/* 월이 바뀌는 지점마다 눈금을 찍되, 시작 지점 바로 옆에 걸리는 달은
   라벨이 겹치므로 xFn 기준 최소 간격(minGap)보다 가까우면 건너뛴다. */
function monthTicks(pts, xFn, minGap){
  const raw = [];
  let last = null;
  pts.forEach((p, i) => {
    const ym = p[0].slice(0, 7);
    if(ym !== last){ raw.push({i, label: ym}); last = ym; }
  });
  const out = [];
  let prevX = -Infinity;
  raw.forEach(t => {
    const xx = xFn(t.i);
    if(xx - prevX >= minGap){ out.push(t); prevX = xx; }
  });
  return out;
}

/* matplotlib 의 MaxNLocator 처럼 1/2/5×10ⁿ 단위로 "깔끔한" 눈금 간격을 고른다. */
function niceNum(range, round){
  const exp = Math.floor(Math.log10(range));
  const frac = range / Math.pow(10, exp);
  let niceFrac;
  if(round){
    niceFrac = frac < 1.5 ? 1 : frac < 3 ? 2 : frac < 7 ? 5 : 10;
  }else{
    niceFrac = frac <= 1 ? 1 : frac <= 2 ? 2 : frac <= 5 ? 5 : 10;
  }
  return niceFrac * Math.pow(10, exp);
}

function niceScale(lo, hi, tickCount){
  if(hi === lo){ hi += 1; lo -= 1; }
  const range = niceNum(hi - lo, false);
  const step = niceNum(range / (tickCount - 1), true);
  const niceLo = Math.floor(lo / step) * step;
  const niceHi = Math.ceil(hi / step) * step;
  const ticks = [];
  for(let v = niceLo; v <= niceHi + step / 2; v += step) ticks.push(+v.toFixed(10));
  return {lo: niceLo, hi: niceHi, ticks};
}

function dualChartSVG(oscPts, pricePts, opt){
  /* 두 계열의 날짜가 다를 수 있다(예: 신용잔고는 발표가 늦어 지수보다 짧다).
     x 축은 두 계열 날짜의 합집합으로 잡고, 각 점은 자기 날짜 위치에 찍는다. */
  const axis = [...new Set([...oscPts, ...pricePts].map(p => p[0]))].sort();
  const pos = new Map(axis.map((d, i) => [d, i]));
  const n = axis.length;
  const oscColor = opt.oscColor || OSC_COLOR, priceColor = opt.priceColor || PRICE_COLOR;
  const oscWidth = opt.oscWidth || 1.4;
  // 기준선(oscRef)이 있으면 그 값도 축 범위에 넣어 항상 보이게 한다.
  // oscRef 는 값 하나 또는 여러 개(예: RSI 30/70). oscRange 를 주면 축을 그 범위로 고정한다.
  const refs = opt.oscRef == null ? [] : [].concat(opt.oscRef);
  const oVals = opt.oscRange ? [...opt.oscRange] : oscPts.map(p => p[1]).concat(refs);
  // 범례를 아래에 두는 카드는 선이 바닥에 닿아 범례와 겹치지 않게 아래로 여백을 둔다.
  if(opt.legendBottom){
    const lo = Math.min(...oVals), hi = Math.max(...oVals);
    oVals.push(lo - (hi - lo) * 0.12);
  }
  const oScale = niceScale(Math.min(...oVals), Math.max(...oVals), 7);
  // pricePts 가 비면(예: 지수 낙폭 카드) 오른쪽 축·선·범례 없이 왼쪽 계열만 그린다.
  const hasPrice = pricePts.length > 0;
  const pScale = hasPrice
    ? niceScale(Math.min(...pricePts.map(p => p[1])), Math.max(...pricePts.map(p => p[1])), 6)
    : {lo: 0, hi: 1, ticks: []};
  const oLo = oScale.lo, oHi = oScale.hi, pLo = pScale.lo, pHi = pScale.hi;

  const x  = i => VB2.l + (i / Math.max(1, n - 1)) * (VB2.w - VB2.l - VB2.r);
  const yO = v => VB2.t + (1 - (v - oLo) / (oHi - oLo)) * (VB2.h - VB2.t - VB2.b);
  const yP = v => VB2.t + (1 - (v - pLo) / (pHi - pLo)) * (VB2.h - VB2.t - VB2.b);

  const oscLine = oscPts.map((p, i) =>
    `${i ? "L" : "M"}${x(pos.get(p[0])).toFixed(1)},${yO(p[1]).toFixed(1)}`).join("");
  const priceLine = pricePts.map((p, i) =>
    `${i ? "L" : "M"}${x(pos.get(p[0])).toFixed(1)},${yP(p[1]).toFixed(1)}`).join("");

  const oTicks = oScale.ticks;
  const pTicks = pScale.ticks;
  const mTicks = monthTicks(axis.map(d => [d]), x, 40);

  const hGrid = oTicks.map(v => {
    const yy = yO(v).toFixed(1);
    return `<line x1="${VB2.l}" x2="${VB2.w - VB2.r}" y1="${yy}" y2="${yy}"
                  stroke="var(--rule)" stroke-width=".6"/>`;
  }).join("");
  const vGrid = mTicks.map(t => {
    const xx = x(t.i).toFixed(1);
    return `<line x1="${xx}" x2="${xx}" y1="${VB2.t}" y2="${VB2.h - VB2.b}"
                  stroke="var(--rule)" stroke-width=".6"/>`;
  }).join("");
  const oLabels = oTicks.map(v => {
    const yy = yO(v).toFixed(1);
    return `<text x="${VB2.l - 5}" y="${(+yy + 2.8).toFixed(1)}" font-size="8"
                  text-anchor="end" fill="${oscColor}">${fmt(v, opt.decimals)}</text>`;
  }).join("");
  const pLabels = pTicks.map(v => {
    const yy = yP(v).toFixed(1);
    return `<text x="${VB2.w - VB2.r + 5}" y="${(+yy + 2.8).toFixed(1)}" font-size="8"
                  fill="${priceColor}">${fmt(v, opt.priceDecimals)}</text>`;
  }).join("");
  const xLabels = mTicks.map(t => {
    const xx = x(t.i).toFixed(1);
    return `<text x="${xx}" y="${VB2.h - VB2.b + 12}" font-size="8"
                  text-anchor="middle" fill="var(--ink-3)">${t.label}</text>`;
  }).join("");

  /* matplotlib 처럼 범례를 플롯 박스 안쪽 모서리에, 배경 박스와 함께 그린다. */
  const refLine = refs.map(ref => {
    const yy = yO(ref).toFixed(1);
    return `<line x1="${VB2.l}" x2="${VB2.w - VB2.r}" y1="${yy}" y2="${yy}"
                  stroke="var(--bad)" stroke-width="1" stroke-dasharray="4 3"/>
            <text x="${VB2.l + 4}" y="${(+yy - 3).toFixed(1)}" font-size="7.5"
                  fill="var(--bad)">${fmt(ref, opt.decimals)}</text>`;
  }).join("");

  // 위쪽 모서리에 선이 붙어 다니는 계열(예: 낙폭 0%)은 legendBottom 으로 아래 모서리에 둔다.
  const ly = opt.legendBottom ? VB2.h - VB2.b - 15 : VB2.t + 3;
  function legendBox(x0, color, label, align){
    const textW = label.length * 4.1 + 19;
    const boxX = align === "end" ? x0 - textW : x0;
    return `<rect x="${boxX.toFixed(1)}" y="${ly}" width="${textW.toFixed(1)}" height="12"
                  fill="var(--surface)" stroke="var(--rule)" stroke-width=".6"/>
            <line x1="${(boxX + 3).toFixed(1)}" x2="${(boxX + 15).toFixed(1)}"
                  y1="${ly + 6}" y2="${ly + 6}" stroke="${color}" stroke-width="1.6"/>
            <text x="${(boxX + 18).toFixed(1)}" y="${ly + 8.5}" font-size="7.5"
                  fill="${color}">${label}</text>`;
  }
  const legend = legendBox(VB2.l + 3, oscColor, opt.oscLegend, "start")
               + (hasPrice ? legendBox(VB2.w - VB2.r - 3, priceColor, opt.priceLegend, "end") : "");

  return {
    markup:`<svg viewBox="0 0 ${VB2.w} ${VB2.h}" role="img" aria-label="${opt.label} 추이">
      ${hGrid}${vGrid}
      <rect x="${VB2.l}" y="${VB2.t}" width="${VB2.w - VB2.l - VB2.r}" height="${VB2.h - VB2.t - VB2.b}"
            fill="none" stroke="var(--rule)" stroke-width="1"/>
      <path d="${priceLine}" fill="none" stroke="${priceColor}" stroke-width="1.4"
            stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${oscLine}" fill="none" stroke="${oscColor}" stroke-width="${oscWidth}"
            stroke-linejoin="round" stroke-linecap="round"/>
      ${refLine}${oLabels}${pLabels}${xLabels}${legend}
    </svg>`
  };
}

/* 여러 계열을 같은 축(고정 범위)에 겹쳐 그리는 차트 — 한국 SIO(3개 종목군)용.
   lines: [{name, pts:[[날짜, 값]...], color, width, marks:[날짜...]}] */
const MULTI_COLORS = ["var(--ink)", "#2f6fd0", "#d97706"];
function multiChartSVG(lines, opt){
  const axis = [...new Set(lines.flatMap(l => l.pts.map(p => p[0])))].sort();
  const pos = new Map(axis.map((d, i) => [d, i]));
  const n = axis.length;
  const [lo, hi] = opt.range;
  const x = i => VB2.l + (i / Math.max(1, n - 1)) * (VB2.w - VB2.l - VB2.r);
  const y = v => VB2.t + (1 - (v - lo) / (hi - lo)) * (VB2.h - VB2.t - VB2.b);
  const ticks = [-100, -50, 0, 50, 100].filter(v => v >= lo && v <= hi);
  // 짧은 구간(수십 거래일 이하)은 월 눈금 대신 날짜(월/일) 눈금과 점을 찍는다
  const short = n <= 40;
  const step = Math.max(1, Math.ceil(n / 8));
  const mTicks = short
    ? axis.map((d, i) => ({i, label: d.slice(5).replace("-", "/")})).filter(t => (n - 1 - t.i) % step === 0)
    : monthTicks(axis.map(d => [d]), x, 40);

  const grid = ticks.map(v => `<line x1="${VB2.l}" x2="${VB2.w - VB2.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"
      stroke="var(--rule)" stroke-width="${v === 0 ? 1 : .6}"/>
    <text x="${VB2.l - 5}" y="${(y(v) + 2.8).toFixed(1)}" font-size="8" text-anchor="end" fill="var(--ink-3)">${v}</text>`).join("")
    + mTicks.map(t => `<line x1="${x(t.i).toFixed(1)}" x2="${x(t.i).toFixed(1)}" y1="${VB2.t}" y2="${VB2.h - VB2.b}"
      stroke="var(--rule)" stroke-width=".6"/>
    <text x="${x(t.i).toFixed(1)}" y="${VB2.h - VB2.b + 12}" font-size="8" text-anchor="middle" fill="var(--ink-3)">${t.label}</text>`).join("");
  const refs = (opt.refs || []).map(v => {
    const c = v < 0 ? "var(--bad)" : "var(--good)";
    return `<line x1="${VB2.l}" x2="${VB2.w - VB2.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"
        stroke="${c}" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="${VB2.w - VB2.r + 4}" y="${(y(v) + 2.8).toFixed(1)}" font-size="8" fill="${c}">${v > 0 ? "+" : ""}${v}</text>`;
  }).join("");
  const paths = lines.map(l => {
    const d = l.pts.map((p, i) => `${i ? "L" : "M"}${x(pos.get(p[0])).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
    const val = new Map(l.pts);
    const marks = (l.marks || []).filter(m => pos.has(m)).map(m =>
      `<path d="M${x(pos.get(m)).toFixed(1)},${(VB2.h - VB2.b - 2).toFixed(1)} l-3.5,-6 h7 z" fill="var(--good)"/>`).join("");
    const dots = short ? l.pts.map(p => `<circle cx="${x(pos.get(p[0])).toFixed(1)}" cy="${y(p[1]).toFixed(1)}"
      r="${l.width > 1.5 ? 2.2 : 1.6}" fill="${l.color}" opacity="${l.width > 1.5 ? 1 : .75}"/>`).join("") : "";
    return `<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.width || 1.3}" stroke-linejoin="round"
      opacity="${l.width > 1.5 ? 1 : .75}"/>${dots}${marks}`;
  }).join("");
  let lx = VB2.l + 3;
  const legend = lines.map(l => {
    const w = l.name.length * 7.2 + 20;
    const g = `<rect x="${lx}" y="${VB2.t + 3}" width="${w}" height="12" fill="var(--surface)" stroke="var(--rule)" stroke-width=".6"/>
      <line x1="${lx + 3}" x2="${lx + 14}" y1="${VB2.t + 9}" y2="${VB2.t + 9}" stroke="${l.color}" stroke-width="1.8"/>
      <text x="${lx + 17}" y="${VB2.t + 11.5}" font-size="7.5" fill="var(--ink-2)">${l.name}</text>`;
    lx += w + 4;
    return g;
  }).join("");
  return {markup: `<svg viewBox="0 0 ${VB2.w} ${VB2.h}" role="img" aria-label="${opt.label} 추이">
      ${grid}<rect x="${VB2.l}" y="${VB2.t}" width="${VB2.w - VB2.l - VB2.r}" height="${VB2.h - VB2.t - VB2.b}"
        fill="none" stroke="var(--rule)" stroke-width="1"/>${refs}${paths}${legend}</svg>`};
}

/* 표시 구간 각 점의 200일 이동평균. 구간 앞쪽도 끊기지 않도록
   전체 계열에서 계산한 뒤 표시 구간만 잘라 쓴다. */
function movingAverage(full, pts, win){
  const idx = new Map(full.map((p, i) => [p[0], i]));
  let sum = 0;
  const ma = full.map((p, i) => {
    sum += p[1];
    if(i >= win) sum -= full[i - win][1];
    return i >= win - 1 ? sum / win : null;
  });
  return pts.map(p => { const i = idx.get(p[0]); return i === undefined ? null : ma[i]; });
}

/* ── 카드 ─────────────────────────────────────────────────────── */
function card(key, s){
  const isDual = s.kind === "dual";
  const full = activeData(s);
  let pts = s.fixed_period_months ? lastMonths(full, s.fixed_period_months) : slice(full, STATE.years);
  // summary_tag 가 있는 카드(예: 신용잔고 낙폭)는 기준선·200일선 판정 대신 그 문구(들)를 쓴다.
  // 그때 카드 색은 osc_ref(기준선) 아래로 내려갔을 때만 경고색으로 바꾼다.
  const {state, word} = s.summary_tag
    ? {state: s.summary_state
             || (s.osc_ref != null && full[full.length - 1][1] <= Math.min(...[].concat(s.osc_ref)) ? "bad" : "neutral"),
       word: s.summary_tag}
    : judge(s, full);
  const [lastDate, lastVal] = full[full.length - 1];
  // 월별 지표는 그 달 1일로 저장돼 "2026-08-01"이 8월 1일로 읽히므로 연-월만 보인다.
  const shownDate = s.freq === "monthly" ? lastDate.slice(0, 7) : lastDate;
  const prev = full[full.length - 2];
  const isPrice = (s.threshold === null || s.threshold === undefined) && !s.delta_unit;

  let delta = "", dir = "";
  if(prev){
    const d = lastVal - prev[1];
    dir = d > 0 ? "up" : d < 0 ? "down" : "";
    delta = isPrice ? `${d >= 0 ? "+" : ""}${(d / prev[1] * 100).toFixed(2)}%`
                    : `${d >= 0 ? "+" : ""}${fmt(d, s.decimals)}${s.delta_unit || s.unit}`;
  }

  // 듀얼 차트는 두 시리즈의 실제 보유 기간이 다를 수 있어(예: 한쪽 소스가 더 짧은
  // 역사만 제공) 더 늦게 시작하는 쪽 날짜로 둘 다 잘라 길이를 맞춘다.
  let pricePts;
  if(isDual){
    const priceFull = s.price_data || [];
    pricePts = !priceFull.length ? []
             : s.fixed_period_months ? lastMonths(priceFull, s.fixed_period_months) : slice(priceFull, STATE.years);
    const from = !pricePts.length || pts[0][0] > pricePts[0][0] ? pts[0][0] : pricePts[0][0];
    pts = pts.filter(p => p[0] >= from);
    pricePts = pricePts.filter(p => p[0] >= from);
  }

  const c = s.kind === "multi"
    ? multiChartSVG(Object.entries(s.groups || {}).map(([name, rows], i) => ({
        name, color: MULTI_COLORS[i % MULTI_COLORS.length], width: i === 0 ? 1.8 : 1.2,
        pts: s.fixed_days ? rows.slice(-s.fixed_days)
           : s.fixed_period_months ? lastMonths(rows, s.fixed_period_months) : slice(rows, STATE.years),
        marks: i === 0 ? (s.bottoms || {})[name] : [] })),
        {range: s.osc_range || [-100, 100], refs: s.osc_ref, label: s.name})
    : isDual
    ? dualChartSVG(pts, pricePts, {decimals:s.decimals, priceDecimals:s.price_decimals, label:s.name,
        oscLegend: s.osc_legend, priceLegend: s.price_legend,
        oscColor: s.osc_color, priceColor: s.price_color, oscWidth: s.osc_width,
        legendBottom: s.legend_bottom, oscRef: s.osc_ref, oscRange: s.osc_range})
    : chartSVG(pts, {threshold:s.threshold, belowIs:s.below_is,
                     decimals:s.decimals, label:s.name,
                     ma: isPrice ? movingAverage(full, pts, 200) : null});

  const fxToggle = s.fixed_fx ? `
    <div class="seg" role="group" aria-label="환율 처리 방식">
      <button type="button" data-fx="usd"   aria-pressed="${STATE.fx === "usd"}">달러 환산</button>
      <button type="button" data-fx="fixed" aria-pressed="${STATE.fx === "fixed"}">고정환율</button>
    </div>` : "";

  const el = document.createElement("article");
  el.className = "card" + (key.startsWith("dip_") ? " dip-card" : "");
  el.id = "card-" + key;
  el.dataset.state = state;
  el.innerHTML = `
    <div class="card-top"><h3>${s.name}${s.card_url ? ` <span class="ext" aria-hidden="true">↗</span>` : ""}</h3>${fxToggle}</div>
    <div class="readout">
      <span class="now">${fmt(lastVal, s.decimals)}${s.unit}</span>
      ${delta ? `<span class="delta" data-dir="${dir}">${delta}</span>` : ""}
      ${[].concat(word || []).map(w => `<span class="tag" title="${w}">${w}</span>`).join("")}
    </div>
    ${s.note ? `<p class="note">${s.note}</p>` : ""}
    <div class="chart">${c.markup}</div>
    <footer>
      <span>${s.source}${s.ref_url
        ? ` · <a href="${s.ref_url}" target="_blank" rel="noopener">${s.ref_label || "참고"}</a>` : ""}</span>
      <span class="${s.stale ? "stale" : ""}">${s.stale ? "갱신 실패 · 직전 값 · " : ""}${s.price_last_date && s.price_last_date !== lastDate
        ? `${s.osc_legend.split(" (")[0]} ${shownDate} · ${s.price_legend} ${s.price_last_date}` : shownDate}</span>
    </footer>`;

  el.querySelectorAll("[data-fx]").forEach(b => {
    b.onclick = () => { STATE.fx = b.dataset.fx; render(); };
  });
  if(!isDual && s.kind !== "multi") bindHover(el.querySelector(".chart"), pts, c, s);

  if(s.card_url){
    el.classList.add("clickable");
    el.tabIndex = 0;
    el.setAttribute("role", "link");
    el.setAttribute("aria-label", `${s.name} — 출처 페이지에서 자세히 보기 (새 탭)`);
    const go = () => window.open(s.card_url, "_blank", "noopener");
    el.addEventListener("click", e => { if(!e.target.closest("a,button")) go(); });
    el.addEventListener("keydown", e => {
      if((e.key === "Enter" || e.key === " ") && !e.target.closest("a,button")){
        e.preventDefault(); go();
      }
    });
  }
  return el;
}

function bindHover(box, pts, c, s){
  const svg = box.querySelector("svg");
  const cross = svg.querySelector(".cross");
  const dot = svg.querySelector(".dot");

  const move = e => {
    const r = box.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const px = (clientX - r.left) / r.width * VB.w;
    let i = Math.round((px - VB.l) / (VB.w - VB.l - VB.r) * (c.n - 1));
    i = Math.max(0, Math.min(c.n - 1, i));
    const [d, v] = pts[i];
    const cx = c.x(i), cy = c.y(v);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("opacity", ".6");
    dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("opacity", "1");
    tip.textContent = `${d} · ${fmt(v, s.decimals)}${s.unit}`;
    tip.style.left = (r.left + scrollX + cx / VB.w * r.width) + "px";
    tip.style.top  = (r.top + scrollY + cy / VB.h * r.height - 8) + "px";
    tip.dataset.on = "1";
  };
  const off = () => {
    cross.setAttribute("opacity", "0");
    dot.setAttribute("opacity", "0");
    tip.dataset.on = "0";
  };
  box.addEventListener("mousemove", move);
  box.addEventListener("mouseleave", off);
  box.addEventListener("touchmove", move, {passive:true});
  box.addEventListener("touchend", off);
}

/* ── 수동 갱신 버튼 ────────────────────────────────────────────────
   GitHub Pages 는 서버가 없어 버튼이 GitHub Actions 를 직접 호출하려면
   인증이 필요하다. Personal Access Token 을 이 브라우저의 localStorage 에만
   저장해두고(서버로는 전송되지 않음) workflow_dispatch API 를 호출한다. */
const GH_OWNER = "shinkichong";
const GH_REPO = "macro-board";
const GH_WORKFLOW = "update-data.yml";

function ghToken(){
  try{ return localStorage.getItem("gh_pat") || ""; }catch(_){ return ""; }
}
function setGhToken(t){
  // 저장에 실패하면(사생활 보호 모드, 일부 앱 안의 브라우저) false — 매번 다시 물어보게 된다
  try{ localStorage.setItem("gh_pat", t); return localStorage.getItem("gh_pat") === t; }catch(_){ return false; }
}
function clearGhToken(){
  try{ localStorage.removeItem("gh_pat"); }catch(_){}
}

/* GitHub 응답을 사람이 이해할 수 있는 원인으로 바꾼다. 토큰 문제면 저장된 토큰을 지운다. */
async function explainGhError(r){
  let msg = "";
  try{ msg = (await r.json()).message || ""; }catch(_){}
  const tail = `\n\n(GitHub 응답: HTTP ${r.status}${msg ? " " + msg : ""})`;
  if(r.status === 401){
    clearGhToken();
    return "토큰이 잘못됐거나 만료됐습니다.\n토큰을 다시 복사해 붙여넣어 주세요. 만료됐다면 새로 발급해야 합니다." + tail;
  }
  if(r.status === 403 && /rate limit/i.test(msg)){
    return "GitHub 요청 한도를 잠시 초과했습니다. 몇 분 뒤 다시 눌러주세요." + tail;
  }
  if(r.status === 403){
    clearGhToken();
    return "토큰에 실행 권한이 없습니다.\n토큰 설정의 Repository permissions 에서 'Actions: Read and write' 를 켜주세요." + tail;
  }
  if(r.status === 404){
    clearGhToken();
    return `토큰이 이 저장소(${GH_OWNER}/${GH_REPO})에 접근할 수 없습니다.\n` +
           `토큰 설정의 Repository access 에서 '${GH_REPO}' 를 선택했는지, Resource owner 가 '${GH_OWNER}' 인지 확인해주세요.` + tail;
  }
  if(r.status === 422){
    return "실행 요청 형식이 맞지 않습니다(워크플로 입력값 문제)." + tail;
  }
  return "요청이 실패했습니다." + tail;
}

async function triggerUpdate(group, btn){
  let token = ghToken();
  if(!token){
    const typed = prompt(
      "GitHub Personal Access Token을 입력하세요.\n" +
      `이 저장소(${GH_REPO})에 대한 'Actions: Read and write' 권한이 필요합니다.\n` +
      "토큰은 이 기기의 이 브라우저에만 저장됩니다 (PC 에 저장한 토큰은 핸드폰에 없습니다)."
    );
    token = (typed || "").replace(/\s+/g, "");   // 붙여넣을 때 섞여 들어온 공백·줄바꿈 제거
    if(!token) return;
    if(!/^(github_pat_|ghp_)[A-Za-z0-9_]+$/.test(token)){
      alert("토큰 형식이 아닙니다. 'github_pat_' 또는 'ghp_' 로 시작하는 문자열 전체를 붙여넣어 주세요.");
      return;
    }
    if(!setGhToken(token)){
      alert("이 브라우저는 토큰을 저장할 수 없습니다(사생활 보호 모드 또는 앱 안의 브라우저).\n" +
            "이번 한 번은 실행하지만 다음에도 다시 물어봅니다. Safari·Chrome 같은 일반 브라우저에서 열면 저장됩니다.");
    }
  }

  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "요청 중…";
  try{
    const r = await fetch(
      `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/actions/workflows/${GH_WORKFLOW}/dispatches`,
      {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ ref: "main", inputs: { group } }),
      }
    );
    if(r.status === 204){
      btn.textContent = "요청됨 ✓";
    }else{
      alert(await explainGhError(r));
      btn.textContent = original;
    }
  }catch(e){
    alert("네트워크 오류로 요청하지 못했습니다: " + e.message);
    btn.textContent = original;
  }
  setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 4000);
}


/* ── Buy-the-Dip 요약 줄 + 기준 팝업 ─────────────────────────────── */
const DIP_LABEL = {dip_spy: ["S&P 500", "SPY"], dip_qqq: ["Nasdaq-100", "QQQ"],
                   dip_kospi: ["코스피", "KOSPI"], dip_kosdaq: ["코스닥", "KOSDAQ"]};

// 운용안 한 줄: 지금 buy 종목에 들어가 있어야 할 몫(전체 자산 대비)
const planPc = v => `${Math.round(v * 100)}%`;
const planHold = p => p.hold.map(([k, w]) => `${k} ${planPc(w)}`).join(" + ");
const planRatio = p => [...p.hold.map(h => planPc(h[1])), planPc(p.cash_w)].join(":");
const planBase = p => (p.hold.find(h => h[0] === p.buy) || [0, 0])[1];   // 평소 들고 있는 buy 종목 비중
function dipPlanText(p){
  const pc = planPc, b = planBase(p);
  if(p.at_high) return `운용안 ${planHold(p)} + 현금 ${pc(p.cash_w)} · 1년 고점 — ${planRatio(p)}로 리밸런싱`;
  return `운용안 ${p.buy} <b>전체의 ${pc(b + p.total_pct)}</b> <small>(${b ? `기본 ${pc(b)} + ` : ""}하락 매수 ${pc(p.total_pct)} · 현금 ${pc(p.cash_w)} 중 ${pc(p.pct)})</small>`;
}

function dipStrip(keys){
  const d = STATE.data;
  const items = keys.filter(k => k.startsWith("dip_") && d.series[k] && d.series[k].data && d.series[k].data.length);
  if(!items.length) return null;
  const wrap = document.createElement("div");
  wrap.className = "dip-strip";
  for(const k of items){
    const s = d.series[k];
    const [name, sub] = DIP_LABEL[k] || [s.name, ""];
    const pts = s.data, last = pts[pts.length - 1], prev = pts[pts.length - 2];
    const diff = prev ? last[1] - prev[1] : 0;
    const [stage, pct, ...notes] = s.summary_tag || ["", ""];
    const gateNote = notes.join(" · ");
    const el = document.createElement("div");
    el.className = "dip-item";
    el.dataset.state = s.summary_state || "neutral";
    el.innerHTML = `
      <div class="dip-name">Buy-the-Dip · ${name}<small>${sub} · ${last[0]}${s.stale ? " · 갱신 실패" : ""}</small></div>
      <span class="dip-buy">● 매수 신호</span>
      <div class="dip-score">${fmt(last[1], 0)}<span>점</span></div>
      ${prev ? `<span class="delta" data-dir="${diff > 0 ? "up" : diff < 0 ? "down" : ""}">${diff >= 0 ? "+" : ""}${fmt(diff, 0)}점</span>` : ""}
      <span class="dip-stage">${stage}</span>
      <span class="dip-pct">권장 <b>${pct}</b>${gateNote ? ` <small>(${gateNote})</small>` : ""}</span>
      ${s.dip_plan ? `<span class="dip-pct dip-plan">${dipPlanText(s.dip_plan)}</span>` : ""}`;
    wrap.appendChild(el);
  }
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "dip-info";
  btn.textContent = "ⓘ 점수 기준 보기";
  btn.onclick = () => openDipDialog(items, items[0]);
  wrap.appendChild(btn);
  return wrap;
}

function render(){
  const d = STATE.data;
  const board = document.getElementById("board");
  board.innerHTML = "";

  const groups = STATE.market === "all" ? d.layout : d.layout.filter(g => g.group === STATE.market);
  for(const grp of groups){
    const sec = document.createElement("section");
    sec.className = "group";
    sec.innerHTML = `<h2><span>${grp.group}</span><span class="rule"></span>
      <button type="button" class="update-btn" data-group="${grp.group}">↻ 업데이트</button></h2>`;
    sec.querySelector(".update-btn").onclick = e => triggerUpdate(grp.group, e.currentTarget);
    const strip = dipStrip(grp.keys);   // Buy-the-Dip 요약은 그룹 맨 위에 항상 보이게
    if(strip) sec.appendChild(strip);
    const grid = document.createElement("div");
    grid.className = "grid";

    for(const key of grp.keys){
      const s = d.series[key];
      if(!s || !s.data || !s.data.length) continue;
      grid.appendChild(card(key, s));
    }
    sec.appendChild(grid);
    board.appendChild(sec);
  }
}

  });

  const rg = document.getElementById("ranges");
  RANGES.forEach(([label, yrs]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.setAttribute("aria-pressed", String(yrs === STATE.years));
    b.onclick = () => {
      STATE.years = yrs;
      [...rg.children].forEach(c => c.setAttribute("aria-pressed", String(c === b)));
      render();
    };
    rg.appendChild(b);
  });

  const root = document.documentElement;
  document.getElementById("theme").onclick = () => {
    const sysDark = matchMedia("(prefers-color-scheme:dark)").matches;
    const cur = root.dataset.theme || (sysDark ? "dark" : "light");
    root.dataset.theme = cur === "dark" ? "light" : "dark";
  };

  render();
  addEventListener("resize", () => { tip.dataset.on = "0"; });
  // 주소 끝에 #dip 을 붙여 열면 Buy-the-Dip 기준 팝업을 바로 띄운다 (#dip-kospi 처럼 시장 지정 가능)
  if(location.hash.startsWith("#dip")){
    const all = d.layout.flatMap(g => g.keys).filter(k => k.startsWith("dip_") && d.series[k]);
    const want = "dip_" + (location.hash.split("-")[1] || "");
    const grpKeys = d.layout.find(g => g.keys.includes(all.includes(want) ? want : all[0])).keys.filter(k => all.includes(k));
    if(all.length) openDipDialog(grpKeys, all.includes(want) ? want : grpKeys[0]);
  }
})();
</script>
</body>
</html>
